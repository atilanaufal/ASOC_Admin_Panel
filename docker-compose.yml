services:
  asoc-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asoc-admin-portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - CRON_MANAGER_URL=http://host.docker.internal:8765
